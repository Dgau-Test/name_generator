[project]
name = "name-generator"
version = "0.1.0"
description = "Fantasy name generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/name_generator"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project]
name = "name-generator"
version = "0.1.0"
description = "Configurable procedural name generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "MIT"

authors = [
    { name = "Артем Вакуленко" },
]

[project.urls]
Repository = "https://github.com/Dgau-Test/name_generator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/name_generator"]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "isort>=9.0.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.isort]
profile = "black"
line_length = 79
src_paths = ["src", "tests", "examples"]
known_first_party = ["name_generator"]

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false